description_long:
  zh: |-
    VoxCPM 是面向多语言场景的语音合成引擎，覆盖普通 TTS、声音设计、可控克隆与极致克隆四种能力。

    声音设计可以只凭文字描述生成新音色；可控克隆与极致克隆在参考音频基础上，分别侧重稳定性与相似度，便于按场景取舍。中英混排文本可以直接输入。

    适合配音、播客、数字人与多语言内容本地化。需要 NVIDIA GPU 与 torch >= 2.5.0。
  en: |-
    VoxCPM is a multilingual speech-synthesis engine covering four capabilities: standard TTS, voice design, controllable cloning and ultra cloning.

    Voice design creates a new timbre from a text description alone, while controllable and ultra cloning build on a reference clip and lean toward stability or similarity respectively. Mixed Chinese-English text can be fed in directly.

    It suits dubbing, podcasts, avatars and multilingual localisation. An NVIDIA GPU and torch >= 2.5.0 are required.
